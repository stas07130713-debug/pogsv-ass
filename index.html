<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover нужен, чтобы env(safe-area-inset-*) перестал возвращать
     ноль: без него нижняя панель на iPhone уезжает под индикатор «домой».
     Масштабирование пальцами намеренно не запрещаем — им пользуются. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- Сама страница не кешируется: иначе после обновления приложения браузер
     продолжает показывать старую версию, пока не нажать Ctrl+F5. -->
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Подготовка горноспасателей ПОГСВ АСС</title>

<!-- Метка ?v= обновляется при выпуске новой версии: без неё браузер и телефон
     продолжают показывать старые скрипты из кеша. -->
<link rel="stylesheet" href="assets/styles.css?v=1.18.2">
<link rel="icon" type="image/png" href="assets/img/favicon.png?v=1.18.2">

<!-- Установка на телефон: значок на рабочем столе и запуск без адресной
     строки браузера. Работает после размещения приложения на сайте. -->
<link rel="manifest" href="manifest.webmanifest?v=1.18.2">
<link rel="apple-touch-icon" href="assets/img/icon-192.png?v=1.18.2">
<meta name="theme-color" content="#0b1017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ПОГСВ АСС">
</head>
<body>

<script>
/* Перехват предложения установки — САМЫМ ПЕРВЫМ, до загрузки всех остальных
   скриптов. Браузер выдаёт beforeinstallprompt один раз и очень рано; если
   подписаться позже, событие уже улетело, и кнопка «Значок на рабочий стол»
   честно, но бесполезно сообщает, что установка недоступна.
   Экран запуска потом забирает событие отсюда. */
window.VGSCH = window.VGSCH || {};
window.VGSCH.install = { event: null, onEvent: null };
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  window.VGSCH.install.event = e;
  if (window.VGSCH.install.onEvent) window.VGSCH.install.onEvent();
});
window.addEventListener('appinstalled', function () {
  window.VGSCH.install.event = null;
  window.VGSCH.install.installed = true;
  if (window.VGSCH.install.onEvent) window.VGSCH.install.onEvent();
});
</script>

<div id="app"></div>

<noscript>
  <div style="padding:24px">Для работы приложения нужен включённый JavaScript.</div>
</noscript>

<!-- Настройки -->
<script src="app/config.js?v=1.18.2"></script>

<!-- Нормативная база (заменяемый блок данных) -->
<script src="app/data/normative/sources.js?v=1.18.2"></script>
<script src="app/data/normative/ustav-251.js?v=1.18.2"></script>
<script src="app/data/normative/fnp-520-app6.js?v=1.18.2"></script>
<script src="app/data/normative/fnp-520-app7.js?v=1.18.2"></script>
<script src="app/data/normative/apparatus.js?v=1.18.2"></script>

<!-- Контент: вопросы и описания задач (заменяемый блок данных) -->
<script src="app/data/questions.js?v=1.18.2"></script>
<script src="app/data/vgk.js?v=1.18.2"></script>
<script src="app/data/tasks/types.js?v=1.18.2"></script>
<script src="app/data/tasks/ranges.js?v=1.18.2"></script>

<!-- Движок -->
<script src="app/engine/rng.js?v=1.18.2"></script>
<script src="app/engine/units.js?v=1.18.2"></script>
<script src="app/engine/solvers/dask.js?v=1.18.2"></script>
<script src="app/engine/solvers/thermal.js?v=1.18.2"></script>
<script src="app/engine/solvers/smoke.js?v=1.18.2"></script>
<script src="app/engine/scheme.js?v=1.18.2"></script>
<script src="app/engine/generator.js?v=1.18.2"></script>
<script src="app/engine/validator.js?v=1.18.2"></script>
<script src="app/engine/pipeline.js?v=1.18.2"></script>

<!-- Каркас интерфейса -->
<script src="app/core/ui.js?v=1.18.2"></script>
<script src="app/core/pdf.js?v=1.18.2"></script>
<script src="app/core/feedback.js?v=1.18.2"></script>
<script src="app/core/state.js?v=1.18.2"></script>
<script src="app/core/router.js?v=1.18.2"></script>

<!-- Экраны -->
<script src="app/screens/start.js?v=1.18.2"></script>
<script src="app/screens/tests.js?v=1.18.2"></script>
<script src="app/screens/tasks.js?v=1.18.2"></script>
<script src="app/screens/exam.js?v=1.18.2"></script>
<script src="app/screens/vgk.js?v=1.18.2"></script>
<script src="app/screens/study.js?v=1.18.2"></script>
<script src="app/screens/protocol.js?v=1.18.2"></script>

<script>
  VGSCH.router.start(document.getElementById('app'));

  /* Работа без связи. Служебный поток разрешён только по https (и на
     localhost): при открытии файла прямо с диска регистрация пропускается —
     там приложение и так не нуждается в сети.
     Метка ?v= передаётся намеренно: по ней поток определяет имя хранилища
     и сам обновляет файлы, когда версия поднимается. */
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost')) {

    /* Когда новый служебный поток берёт управление, страница перезагружается
       сама — один раз. Без этого после обновления приходилось обновлять
       вручную дважды: первый заход отдавал новую страницу со старыми
       скриптами, и правки выглядели как непришедшие. */
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });

    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js?v=1.18.2').then(function (reg) {
        /* Проверка обновления при каждом запуске: браузер сам ходит за новым
           потоком не всегда, а приложение должно быть свежим. */
        reg.update();
      }).catch(function () {});
    });
  }
</script>
</body>
</html>
