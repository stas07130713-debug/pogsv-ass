<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover нужен, чтобы env(safe-area-inset-*) перестал возвращать
     ноль: без него нижняя панель на iPhone уезжает под индикатор «домой».
     Масштабирование пальцами намеренно не запрещаем — им пользуются. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- Сама страница не кешируется: иначе после обновления приложения браузер
     продолжает показывать старую версию, пока не нажать Ctrl+F5. -->
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Подготовка горноспасателей ПОГСВ АСС</title>

<!-- Метка ?v= обновляется при выпуске новой версии: без неё браузер и телефон
     продолжают показывать старые скрипты из кеша. -->
<link rel="stylesheet" href="assets/styles.css?v=1.11.5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⛑</text></svg>">

<!-- Установка на телефон: значок на рабочем столе и запуск без адресной
     строки браузера. Работает после размещения приложения на сайте. -->
<link rel="manifest" href="manifest.webmanifest?v=1.11.5">
<link rel="apple-touch-icon" href="assets/img/icon-192.png?v=1.11.5">
<meta name="theme-color" content="#0b1017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ПОГСВ АСС">
</head>
<body>

<div id="app"></div>

<noscript>
  <div style="padding:24px">Для работы приложения нужен включённый JavaScript.</div>
</noscript>

<!-- Настройки -->
<script src="app/config.js?v=1.11.5"></script>

<!-- Нормативная база (заменяемый блок данных) -->
<script src="app/data/normative/sources.js?v=1.11.5"></script>
<script src="app/data/normative/ustav-251.js?v=1.11.5"></script>
<script src="app/data/normative/fnp-520-app6.js?v=1.11.5"></script>
<script src="app/data/normative/fnp-520-app7.js?v=1.11.5"></script>
<script src="app/data/normative/apparatus.js?v=1.11.5"></script>

<!-- Контент: вопросы и описания задач (заменяемый блок данных) -->
<script src="app/data/questions.js?v=1.11.5"></script>
<script src="app/data/tasks/types.js?v=1.11.5"></script>
<script src="app/data/tasks/ranges.js?v=1.11.5"></script>

<!-- Движок -->
<script src="app/engine/rng.js?v=1.11.5"></script>
<script src="app/engine/units.js?v=1.11.5"></script>
<script src="app/engine/solvers/dask.js?v=1.11.5"></script>
<script src="app/engine/solvers/thermal.js?v=1.11.5"></script>
<script src="app/engine/solvers/smoke.js?v=1.11.5"></script>
<script src="app/engine/scheme.js?v=1.11.5"></script>
<script src="app/engine/generator.js?v=1.11.5"></script>
<script src="app/engine/validator.js?v=1.11.5"></script>
<script src="app/engine/pipeline.js?v=1.11.5"></script>

<!-- Каркас интерфейса -->
<script src="app/core/ui.js?v=1.11.5"></script>
<script src="app/core/pdf.js?v=1.11.5"></script>
<script src="app/core/feedback.js?v=1.11.5"></script>
<script src="app/core/state.js?v=1.11.5"></script>
<script src="app/core/router.js?v=1.11.5"></script>

<!-- Экраны -->
<script src="app/screens/start.js?v=1.11.5"></script>
<script src="app/screens/tests.js?v=1.11.5"></script>
<script src="app/screens/tasks.js?v=1.11.5"></script>
<script src="app/screens/exam.js?v=1.11.5"></script>
<script src="app/screens/study.js?v=1.11.5"></script>
<script src="app/screens/protocol.js?v=1.11.5"></script>

<script>
  VGSCH.router.start(document.getElementById('app'));

  /* Работа без связи. Служебный поток разрешён только по https (и на
     localhost): при открытии файла прямо с диска регистрация пропускается —
     там приложение и так не нуждается в сети.
     Метка ?v= передаётся намеренно: по ней поток определяет имя хранилища
     и сам обновляет файлы, когда версия поднимается. */
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js?v=1.11.5').catch(function () {});
    });
  }
</script>
</body>
</html>
